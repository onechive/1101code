<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>3D Interactive Rubik's Cube | Original GLB Model</title>
  <script>
    // 첫 방문 1회 노출 제어 (새로고침 시 인트로 비디오 오버레이 깜빡임 방지)
    if (sessionStorage.getItem('hasSeenIntro') === 'true') {
      document.documentElement.classList.add('has-seen-intro');
    }
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
    }

    #webgl-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      touch-action: none;
    }

    /* UI Overlay */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      padding: 24px;
      z-index: 10;
    }

    /* Actions / Buttons */
    .controls-panel {
      pointer-events: auto;
      display: flex;
      gap: 10px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.7);
      color: var(--ui-fg, #1e293b);
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.35);
      color: var(--ui-fg, #000000);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18), inset 0 1px 0 rgba(255, 255, 255, 1);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Loading Spinner */
    .loader-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
      transition: opacity 0.5s ease;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(56, 189, 248, 0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Video Intro Overlay & Controls */
    html.has-seen-intro #intro-overlay {
      display: none !important;
    }

    #intro-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      z-index: 99999;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      pointer-events: auto;
    }

    #intro-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .intro-controls {
      position: absolute;
      top: 24px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100000;
    }

    .intro-btn {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(16px) saturate(160%);
      -webkit-backdrop-filter: blur(16px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.45);
      color: #ffffff;
      height: 42px;
      padding: 0 16px;
      border-radius: 21px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.5);
      user-select: none;
      -webkit-user-select: none;
    }

    .intro-btn:hover {
      background: rgba(255, 255, 255, 0.32);
      border-color: rgba(255, 255, 255, 0.8);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .intro-btn:active {
      transform: translateY(0);
    }

    #intro-mute-btn {
      width: 42px;
      height: 42px;
      padding: 0;
      border-radius: 50%;
    }

    @media (max-width: 640px) {
      .intro-controls {
        top: 16px;
        right: 16px;
        gap: 8px;
      }
      .intro-btn {
        height: 38px;
        padding: 0 14px;
        font-size: 12px;
      }
      #intro-mute-btn {
        width: 38px;
        height: 38px;
      }
    }
  </style>
</head>

<body>
  <!-- Fullscreen Video Intro Overlay -->
  <div id="intro-overlay">
    <video id="intro-video" playsinline preload="auto">
      <source src="../fbx/intro.mp4" type="video/mp4">
      <source src="intro.mp4" type="video/mp4">
    </video>
    <div class="intro-controls">
      <button id="intro-mute-btn" class="intro-btn" aria-label="Toggle Mute" title="음소거 토글">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>
        </svg>
      </button>
      <button id="intro-skip-btn" class="intro-btn" aria-label="Skip Intro" title="건너뛰기">
        <span>SKIP</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="5 4 15 12 5 20 5 4"></polygon>
          <line x1="19" y1="5" x2="19" y2="19"></line>
        </svg>
      </button>
    </div>
  </div>

  <div id="webgl-container"></div>

  <!-- Loading Screen -->
  <div class="loader-overlay" id="loader">
    <div class="spinner"></div>
  </div>

  <!-- UI Overlay -->
  <div class="ui-layer">
    <div class="controls-panel">
      <button class="btn" id="btn-shuffle" aria-label="Shuffle">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8"></polyline>
          <line x1="4" y1="20" x2="21" y2="3"></line>
          <polyline points="21 16 21 21 16 21"></polyline>
          <line x1="15" y1="15" x2="21" y2="21"></line>
          <line x1="4" y1="4" x2="9" y2="9"></line>
        </svg>
      </button>
      <button class="btn" id="btn-reset" aria-label="Front view">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="3" width="5" height="5" rx="1"></rect>
          <rect x="9.5" y="3" width="5" height="5" rx="1"></rect>
          <rect x="16" y="3" width="5" height="5" rx="1"></rect>
          <rect x="3" y="9.5" width="5" height="5" rx="1"></rect>
          <rect x="9.5" y="9.5" width="5" height="5" rx="1"></rect>
          <rect x="16" y="9.5" width="5" height="5" rx="1"></rect>
          <rect x="3" y="16" width="5" height="5" rx="1"></rect>
          <rect x="9.5" y="16" width="5" height="5" rx="1"></rect>
          <rect x="16" y="16" width="5" height="5" rx="1"></rect>
        </svg>
      </button>
    </div>
  </div>

  <!-- Three.js, OrbitControls, GLTFLoader, GSAP via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script>
    /**
     * =========================================================================
     * [Rubik's Cube 3D Interaction Engine with User's Original cube.glb]
     * Three.js + WebGL + Dynamic Grouping + GSAP Snap Animation
     * =========================================================================
     */

    const CONFIG = {
      glbPath: '../fbx/cube1103+animation.glb',
      altTexturePath: '../fbx/uv+ap.png',   // 마우스가 지나갈 때 드러나는 텍스처 (UV 배치 동일)
      altBrightness: 1.3,                   // uv+ap.png 밝기 배율
      // 정면에서 왼쪽 위 → 오른쪽 아래 순서(01~09)
      songs: [
        '../fbx/01.Xtal.mp3',
        '../fbx/02.Tha.mp3',
        '../fbx/03.Pulsewidth.mp3',
        '../fbx/04.Ageispolis.mp3',
        '../fbx/05.I.mp3',
        '../fbx/06.GreenCalx.mp3',
        '../fbx/07.Wearethemusicmakers.mp3',
        '../fbx/08.Hedphelym.mp3',
        '../fbx/09.Actium.mp3'
      ],
      snapDuration: 0.35,        // 90도 스냅 회전 애니메이션 시간 (초)
      snapEase: 'power2.out',    // GSAP 이징 커브
      dragThreshold: 6,          // 드래그 판정 픽셀 임계값
      cubeSpacing: 5.495         // 원본 GLB 모델의 큐브 조각 간 간격 (Blender 원본 단위)
    };

    let scene, camera, renderer, controls;
    let cubelets = [];           // 사용자의 27개 큐브 조각 오브젝트 배열
    let cubeGroup;               // 큐브 전체를 담는 루트 컨테이너 (원점 0,0,0)
    let isRotating = false;      // 현재 회전 애니메이션 중 인터랙션 락(Lock)

    // 인터랙션 세션 상태
    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    const dragSession = {
      isPointerDown: false,
      startScreenPos: new THREE.Vector2(),
      currentScreenPos: new THREE.Vector2(),
      clickedCubelet: null,
      clickedPoint: new THREE.Vector3(),
      clickedWorldNormal: new THREE.Vector3(),
      axisName: 'x',             // 'x' | 'y' | 'z'
      activeSliceCubelets: [],   // 이번 회전에 참여하는 9개의 큐브 조각들
      tempPivot: null,           // 동적 그룹화를 위한 임시 피벗 Object3D
      dragState: 'IDLE',         // 'IDLE' | 'PENDING' | 'ROTATING'
      screenTangent: new THREE.Vector2() // 화면에 투영된 양의 회전 방향 2D 벡터
    };

    // --- 1. 초기 씬 및 렌더러 환경 세팅 ---
    function init() {
      const container = document.getElementById('webgl-container');
      const width = window.innerWidth;
      const height = window.innerHeight;

      // 씬 생성
      scene = new THREE.Scene();
      scene.background = null;   // 투명 → body의 움직이는 그라데이션 배경이 보임
      scene.fog = new THREE.FogExp2(0xffffff, 0.015);

      // 카메라 설정 (사용자 큐브 크기에 최적화된 위치)
      camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 200);
      camera.position.set(18, 16, 22);

      // 렌더러 설정
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
      renderer.setClearColor(0x000000, 0);
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      container.appendChild(renderer.domElement);

      // OrbitControls (배경 빈 공간 드래그 시 360도 회전)
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.minDistance = 22;   // 큐브 안쪽으로 들어가지 않도록 최소 거리 제한
      controls.maxDistance = 60;
      controls.rotateSpeed = 0.85;

      // 조명 설정
      setupLighting();

      // 바닥 그림자 수신 평면
      setupGround();

      // 큐브 컨테이너
      cubeGroup = new THREE.Group();
      cubeGroup.visible = false;   // 오프닝이 끝난 뒤 등장
      scene.add(cubeGroup);

      // 인트로 비디오 및 세션 제어 실행
      setupIntroVideo();

      // 첫 방문 여부 확인 (세션 스토리지)
      const hasSeen = sessionStorage.getItem('hasSeenIntro') === 'true';
      if (hasSeen) {
        // 이미 비디오 인트로를 본 사용자(새로고침 포함): 비디오 없이 바로 파티클 오프닝 실행
        introStarted = true;
        isRotating = true;
        controls.enabled = false;
        startIntro();
      } else {
        // 첫 방문: 비디오 인트로가 먼저 재생되며, 비디오 종료 또는 Skip 시 파티클 오프닝 실행
        isRotating = true;
        controls.enabled = false;
      }

      // 포인터 이벤트 리스너 등록
      setupPointerEvents(container);

      // UI 버튼 이벤트 등록
      setupUIEvents();

      // 원본 cube.glb 로드
      loadUserGLB();

      // 리사이즈
      window.addEventListener('resize', onWindowResize);

      // 렌더 루프 시작
      animate();
    }

    // --- 조명 세팅 ---
    function setupLighting() {
      // 1. Ambient Light
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
      scene.add(ambientLight);

      // 2. Main Directional Light (부드러운 스튜디오 섀도우)
      const dirLight = new THREE.DirectionalLight(0xfff6ea, 1.3);
      dirLight.position.set(24, 38, 28);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      dirLight.shadow.camera.near = 1;
      dirLight.shadow.camera.far = 100;
      const d = 16;
      dirLight.shadow.camera.left = -d;
      dirLight.shadow.camera.right = d;
      dirLight.shadow.camera.top = d;
      dirLight.shadow.camera.bottom = -d;
      dirLight.shadow.bias = -0.0003;
      dirLight.shadow.radius = 2.5;
      scene.add(dirLight);

      // 3. Fill Light (반대편 은은한 블루 필라이트)
      const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.6);
      fillLight.position.set(-20, -10, -20);
      scene.add(fillLight);

      // 4. Rim Light (큐브 외곽 엣지 하이라이트)
      const rimLight = new THREE.DirectionalLight(0x818cf8, 0.5);
      rimLight.position.set(0, 24, -20);
      scene.add(rimLight);
    }

    // --- 바닥 섀도우 평면 ---
    function setupGround() {
      const groundGeo = new THREE.PlaneGeometry(80, 80);
      const groundMat = new THREE.ShadowMaterial({ opacity: 0.35 });
      const groundMesh = new THREE.Mesh(groundGeo, groundMat);
      groundMesh.rotation.x = -Math.PI / 2;
      groundMesh.position.y = -11.5;
      groundMesh.receiveShadow = true;
      scene.add(groundMesh);
    }

    // --- 2. 사용자의 원본 GLB 파일 로드 및 정렬 ---
    function loadUserGLB() {
      const loader = new THREE.GLTFLoader();

      // 캐시 방지 쿼리 파라미터 적용
      const url = CONFIG.glbPath + '?v=' + Date.now();

      loader.load(
        url,
        (gltf) => {
          hideLoader();

          /**
           * [중요 원칙]:
           * 사용자가 Blender에서 모델링한 27개 조각의 고유한 메시 형태, 
           * 각 면의 PBR 머티리얼, 스케일(약 2.747), 버텍스 오프셋을 
           * 일체 왜곡하거나 재정의하지 않고 100% 원본 그대로 보존합니다.
           */
          const totalBox = new THREE.Box3().setFromObject(gltf.scene);
          const totalCenter = new THREE.Vector3();
          totalBox.getCenter(totalCenter);

          // 27개의 큐브 조각 오브젝트 추출
          const objects = [...gltf.scene.children];
          cubelets = [];

          objects.forEach((obj) => {
            // 그림자 활성화
            obj.traverse((child) => {
              if (child.isMesh) {
                child.castShadow = true;
                child.receiveShadow = true;
              }
            });

            // 전체 큐브 중심이 (0,0,0)에 오도록 원점 오프셋만 평행 이동
            obj.position.sub(totalCenter);

            obj.userData.initialPosition = obj.position.clone();
            obj.userData.initialQuaternion = obj.quaternion.clone();

            cubeGroup.add(obj);
            cubelets.push(obj);
          });

          // 처음부터 섞인 상태로 시작 (오프닝 때는 형태가 동일하므로 티가 나지 않음)
          scrambleInstantly(20);

          setupHoverReveal();

          glbReady = true;
          tryReveal();
        },
        undefined,
        (err) => {
          console.error('Failed to load user cube.glb:', err);
          hideLoader();
          glbReady = true;
          tryReveal();
        }
      );
    }

    // --- 인트로 영상 사양 및 오디오 / 화면 전환 / 세션 제어 ---
    function setupIntroVideo() {
      const hasSeen = sessionStorage.getItem('hasSeenIntro') === 'true';
      const overlay = document.getElementById('intro-overlay');
      const video = document.getElementById('intro-video');
      const muteBtn = document.getElementById('intro-mute-btn');
      const skipBtn = document.getElementById('intro-skip-btn');

      if (hasSeen) {
        if (overlay) overlay.style.display = 'none';
        return;
      }

      if (!video || !overlay) return;

      let isEnding = false;

      function updateMuteUI() {
        if (!muteBtn || !video) return;
        if (video.muted || video.volume === 0) {
          muteBtn.innerHTML = `
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>`;
          muteBtn.setAttribute('title', '소리 켜기 (Unmute)');
          muteBtn.setAttribute('aria-label', 'Unmute');
        } else {
          muteBtn.innerHTML = `
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
            </svg>`;
          muteBtn.setAttribute('title', '음소거 (Mute)');
          muteBtn.setAttribute('aria-label', 'Mute');
        }
      }

      function transitionOut() {
        if (isEnding) return;
        isEnding = true;
        sessionStorage.setItem('hasSeenIntro', 'true');

        overlay.style.transition = 'opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1)';
        overlay.style.opacity = '0';
        overlay.style.pointerEvents = 'none';

        // 비디오 페이드아웃 후 3D 파티클 오프닝 시작
        if (!introStarted) {
          introStarted = true;
          isRotating = true;
          controls.enabled = false;
          startIntro();
        }

        setTimeout(() => {
          overlay.style.display = 'none';
          try { video.pause(); } catch (e) {}
        }, 800);
      }

      // 1. 영상 종료 약 0.5~1초 전 (0.8초 전) 감지하여 페이드아웃
      video.addEventListener('timeupdate', () => {
        if (isEnding) return;
        if (video.duration && video.currentTime >= Math.max(0, video.duration - 0.8)) {
          transitionOut();
        }
      });

      video.addEventListener('ended', () => {
        transitionOut();
      });

      // 2. Skip 버튼 상시 배치
      if (skipBtn) {
        skipBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          transitionOut();
        });
      }

      // 3. Mute 토글 버튼
      if (muteBtn) {
        muteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          video.muted = !video.muted;
          if (!video.muted) {
            video.volume = 1.0;
            if (video.paused) video.play().catch(() => {});
          }
          updateMuteUI();
        });
      }

      // 4. 자동재생 (기본 소리 켜고 시도 -> 정책 차단 시 음소거 상태로 자동재생 유지)
      video.muted = false;
      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise.then(() => {
          updateMuteUI();
        }).catch((err) => {
          console.log('Autoplay with sound prevented by browser policy, fallback to muted:', err);
          video.muted = true;
          video.play().catch((e) => console.warn('Muted autoplay failed:', e));
          updateMuteUI();
        });
      }
    }

    // --- 오프닝: 파티클이 큐브 형태로 모였다가 사라진 뒤 큐브 등장 ---
    let glbReady = false;
    let introStarted = false;
    let introDone = false;
    let revealed = false;

    function startIntro() {
      hideLoader();

      // 3x3x3 = 27개의 작은 큐브가 하나씩 차례로 파티클로 형성됨
      const PER_CUBE = 2600;
      const COUNT = PER_CUBE * 27;
      const spacing = CONFIG.cubeSpacing;
      const half = spacing * 0.49;               // 작은 큐브 하나의 반 크기
      const starts = new Float32Array(COUNT * 3);
      const targets = new Float32Array(COUNT * 3);
      const rands = new Float32Array(COUNT);
      const orders = new Float32Array(COUNT);

      const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;
      const sgn = () => (Math.random() < 0.5 ? -1 : 1);

      // 큐브가 나타나는 순서 (무작위로 하나씩)
      const seq = [];
      for (let n = 0; n < 27; n++) seq.push(n);
      for (let n = seq.length - 1; n > 0; n--) {
        const m = Math.floor(Math.random() * (n + 1));
        [seq[n], seq[m]] = [seq[m], seq[n]];
      }

      let idx = 0;
      for (let c = 0; c < 27; c++) {
        const cx = (Math.floor(c / 9) - 1) * spacing;
        const cy = (Math.floor((c % 9) / 3) - 1) * spacing;
        const cz = ((c % 3) - 1) * spacing;
        const order = seq[c] / 26;

        for (let n = 0; n < PER_CUBE; n++, idx++) {
          // 시작: 해당 큐브 위치 주변의 흐릿한 구름
          starts[idx * 3] = cx + gauss() * half * 1.7;
          starts[idx * 3 + 1] = cy + gauss() * half * 1.7;
          starts[idx * 3 + 2] = cz + gauss() * half * 1.7;

          // 목표: 작은 큐브의 모서리(60%) / 꼭짓점(15%) / 면(25%)
          const r = Math.random();
          const p = [0, 0, 0];
          if (r < 0.6) {
            const axis = Math.floor(Math.random() * 3);
            for (let k = 0; k < 3; k++) p[k] = sgn() * half;
            p[axis] = (Math.random() * 2 - 1) * half;
          } else if (r < 0.75) {
            for (let k = 0; k < 3; k++) p[k] = sgn() * half;
            for (let k = 0; k < 3; k++) p[k] -= Math.sign(p[k]) * Math.abs(gauss()) * half * 0.18;
          } else {
            const axis = Math.floor(Math.random() * 3);
            for (let k = 0; k < 3; k++) p[k] = (Math.random() * 2 - 1) * half;
            p[axis] = sgn() * half;
          }
          const j = half * 0.03;
          targets[idx * 3] = cx + p[0] + gauss() * j;
          targets[idx * 3 + 1] = cy + p[1] + gauss() * j;
          targets[idx * 3 + 2] = cz + p[2] + gauss() * j;
          rands[idx] = Math.random();
          orders[idx] = order;
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(targets.slice(), 3));
      geo.setAttribute('aStart', new THREE.BufferAttribute(starts, 3));
      geo.setAttribute('aTarget', new THREE.BufferAttribute(targets, 3));
      geo.setAttribute('aRand', new THREE.BufferAttribute(rands, 1));
      geo.setAttribute('aOrder', new THREE.BufferAttribute(orders, 1));

      const mat = new THREE.ShaderMaterial({
        transparent: true,
        depthWrite: false,
        blending: THREE.NormalBlending,
        uniforms: {
          uProgress: { value: 0 },
          uFade: { value: 0 },
          uSize: { value: 0.28 },
          uPixelRatio: { value: renderer.getPixelRatio() }
        },
        vertexShader: `
          attribute vec3 aStart;
          attribute vec3 aTarget;
          attribute float aRand;
          attribute float aOrder;
          uniform float uProgress;
          uniform float uFade;
          uniform float uSize;
          uniform float uPixelRatio;
          varying float vAlpha;
          void main() {
            // 큐브마다 시작 시점이 다름 (aOrder) → 하나, 둘, 셋… 차례로 형성
            float raw = clamp((uProgress - aOrder * 0.62 - aRand * 0.06) / 0.3, 0.0, 1.0);
            float t = raw * raw * (3.0 - 2.0 * raw);
            vec3 p = mix(aStart, aTarget, t);
            float appear = smoothstep(0.0, 0.12, uProgress - aOrder * 0.62);
            vAlpha = appear * (0.3 + 0.7 * t) * (1.0 - uFade);
            vec4 mv = modelViewMatrix * vec4(p, 1.0);
            gl_PointSize = uSize * uPixelRatio * (0.6 + aRand * 0.9) * (300.0 / -mv.z);
            gl_Position = projectionMatrix * mv;
          }
        `,
        fragmentShader: `
          varying float vAlpha;
          void main() {
            float d = length(gl_PointCoord - 0.5);
            if (d > 0.5) discard;
            gl_FragColor = vec4(vec3(0.08), vAlpha * smoothstep(0.5, 0.1, d));
          }
        `
      });

      const points = new THREE.Points(geo, mat);
      points.rotation.set(0.6, Math.PI * 0.9, 0);
      scene.add(points);

      const tl = gsap.timeline({ delay: 0.3 });
      tl.to(mat.uniforms.uProgress, { value: 1, duration: 5.0, ease: 'none' }, 0)
        .to(points.rotation, { x: 0, y: 0, duration: 5.0, ease: 'power2.out' }, 0)
        .add(() => { introDone = true; tryReveal(); }, '+=0.3');

      introParticles = { points, geo, mat };
    }

    let introParticles = null;

    // 파티클이 서서히 옅어지는 동시에 큐브 오브젝트가 서서히 나타남 (크로스 페이드)
    function tryReveal() {
      if (revealed || !introDone || !glbReady) return;
      revealed = true;

      // 큐브 머티리얼을 투명 상태로 시작
      const mats = new Set();
      cubeGroup.traverse((child) => {
        if (child.isMesh) {
          (Array.isArray(child.material) ? child.material : [child.material]).forEach((m) => mats.add(m));
        }
      });
      const saved = [];
      mats.forEach((m) => {
        saved.push({ m, transparent: m.transparent, opacity: m.opacity, depthWrite: m.depthWrite });
        m.transparent = true;
        m.opacity = 0;
        m.depthWrite = false;
        m.needsUpdate = true;
      });
      cubeGroup.visible = true;

      const fade = { v: 0 };
      gsap.to(fade, {
        v: 1,
        duration: introParticles ? 2.2 : 0.6,
        ease: 'sine.inOut',
        onUpdate: () => {
          saved.forEach((s) => { s.m.opacity = s.opacity * fade.v; });
          if (introParticles) introParticles.mat.uniforms.uFade.value = fade.v;
        },
        onComplete: () => {
          saved.forEach((s) => {
            s.m.transparent = s.transparent;
            s.m.opacity = s.opacity;
            s.m.depthWrite = s.depthWrite;
            s.m.needsUpdate = true;
          });
          if (introParticles) {
            scene.remove(introParticles.points);
            introParticles.geo.dispose();
            introParticles.mat.dispose();
            introParticles = null;
          }
          isRotating = false;
          controls.enabled = true;
        }
      });
    }

    // --- 마우스가 지나간 자리에 uv+ap.png 텍스처가 샤르르 드러나는 '껍질' 효과 ---
    const TRAIL_MAX = 64;
    const trail = [];                                   // { point: Vector3, strength }
    let lastHoverPoint = null;
    let hoverTime = 0;
    const hoverUniforms = {
      uTrail: { value: Array.from({ length: TRAIL_MAX }, () => new THREE.Vector4(0, 0, 0, 0)) },
      uAltMap: { value: null },
      uRadius: { value: 3.0 },                           // 드러나는 반경 (월드 단위)
      uTime: { value: 0 },
      uEnable: { value: 0 },                             // 정면 보기 상태에서만 1
      // 클릭으로 선택된 사진 (2칸: 이전/현재 교차 페이드). xyz=타일 중심, w=페이드 알파
      uSelC: { value: [new THREE.Vector4(), new THREE.Vector4()] },
      // xyz=클릭 지점, w=물결처럼 퍼지는 반경
      uSelP: { value: [new THREE.Vector4(), new THREE.Vector4()] },
      uSelHalf: { value: CONFIG.cubeSpacing * 0.5 },
      uAltBright: { value: CONFIG.altBrightness }
    };

    // 정면 보기 모드 on/off (텍스처 드러내기 효과 활성화 여부)
    function setFrontMode(on) {
      gsap.to(hoverUniforms.uEnable, { value: on ? 1 : 0, duration: on ? 0.6 : 0.4, overwrite: true });
      if (!on) { trail.length = 0; lastHoverPoint = null; }
      frontMode = on;
      if (!on) stopSong();   // 정면에서 벗어나면 노래 중단
    }
    let frontMode = false;

    function setupHoverReveal() {
      const altTex = new THREE.TextureLoader().load(CONFIG.altTexturePath, (t) => {
        hoverUniforms.uAltMap.value = t;
      });
      altTex.flipY = false;                              // glTF 텍스처와 동일한 UV 방향
      altTex.encoding = THREE.sRGBEncoding;
      altTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      hoverUniforms.uAltMap.value = altTex;

      const patched = new Set();
      cubeGroup.traverse((child) => {
        if (!child.isMesh) return;
        (Array.isArray(child.material) ? child.material : [child.material]).forEach((m) => {
          if (!m.map || patched.has(m)) return;
          patched.add(m);
          altTex.wrapS = m.map.wrapS;
          altTex.wrapT = m.map.wrapT;

          m.onBeforeCompile = (shader) => {
            Object.assign(shader.uniforms, hoverUniforms);

            shader.vertexShader = shader.vertexShader
              .replace('#include <common>', '#include <common>\nvarying vec3 vWPos;')
              .replace('#include <project_vertex>',
                '#include <project_vertex>\nvWPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');

            shader.fragmentShader = shader.fragmentShader
              .replace('#include <common>', `#include <common>
                varying vec3 vWPos;
                uniform vec4 uTrail[${TRAIL_MAX}];
                uniform sampler2D uAltMap;
                uniform float uRadius;
                uniform float uTime;
                uniform float uEnable;
                uniform vec4 uSelC[2];
                uniform vec4 uSelP[2];
                uniform float uSelHalf;
                uniform float uAltBright;`)
              .replace('#include <map_fragment>', `
                // 물결처럼 일렁이는 경계 + 미세한 UV 굴절
                float wob = sin(vWPos.x * 1.7 + uTime * 2.1) * sin(vWPos.y * 1.9 - uTime * 1.7)
                          + sin(vWPos.z * 2.3 + uTime * 1.5) * 0.7;
                vec2 warp = vec2(sin(vWPos.y * 2.6 + uTime * 2.4), cos(vWPos.x * 2.6 - uTime * 2.0));

                float reveal = 0.0;
                for (int i = 0; i < ${TRAIL_MAX}; i++) {
                  float w = uTrail[i].w;
                  float r = uRadius * (0.35 + 0.65 * w);           // 오래될수록 좁아져 꼬리가 가늘어짐
                  float d = distance(vWPos, uTrail[i].xyz) + wob * 0.28 * (1.0 - w * 0.5);
                  reveal += smoothstep(r, 0.0, d) * w;
                }
                reveal = clamp(reveal, 0.0, 1.0) * uEnable;

                vec2 uvAlt = vUv + warp * 0.0012 * reveal;
                vec4 baseTexel = mapTexelToLinear(texture2D(map, vUv));
                vec4 altTexel = mapTexelToLinear(texture2D(uAltMap, uvAlt));
                altTexel.rgb *= uAltBright;
                float grain = fract(sin(dot(floor(vUv * 1800.0), vec2(12.9898, 78.233))) * 43758.5453);
                float mixAmt = smoothstep(0.0, 0.6, reveal * 1.3 - grain * 0.2);

                // 클릭으로 선택된 사진: 클릭 지점에서 물결처럼 퍼지며 계속 유지됨
                float selMask = 0.0;
                for (int i = 0; i < 2; i++) {
                  vec3 dd = abs(vWPos - uSelC[i].xyz);
                  float inFace = step(dd.x, 0.4)
                    * (1.0 - smoothstep(uSelHalf - 0.5, uSelHalf, dd.y))
                    * (1.0 - smoothstep(uSelHalf - 0.5, uSelHalf, dd.z));
                  float rr = uSelP[i].w;
                  float dist = distance(vWPos, uSelP[i].xyz) + wob * 0.25;
                  float ripple = 1.0 - smoothstep(rr - 1.8, rr, dist);
                  selMask = max(selMask, inFace * ripple * uSelC[i].w);
                }
                mixAmt = max(mixAmt, selMask * uEnable);
                // 알파는 건드리지 않음 (투명 캔버스에서 텍스처 알파 때문에 비쳐 보이는 현상 방지)
                diffuseColor.rgb *= mix(baseTexel, altTexel, mixAmt).rgb;
              `);
          };
          m.needsUpdate = true;
        });
      });
    }

    function addTrailPoint(point) {
      // 이전 위치와 현재 위치 사이를 촘촘히 채워 끊기지 않는 꼬리를 만듦
      if (lastHoverPoint && lastHoverPoint.distanceTo(point) < 9) {
        const dist = lastHoverPoint.distanceTo(point);
        const steps = Math.max(1, Math.ceil(dist / 0.5));
        for (let s = 1; s <= steps; s++) {
          pushTrail(lastHoverPoint.clone().lerp(point, s / steps));
        }
      } else {
        pushTrail(point);
      }
      lastHoverPoint = point.clone();
    }

    function pushTrail(p) {
      trail.push({ point: p, strength: 1 });
      if (trail.length > TRAIL_MAX) trail.shift();
    }

    function updateTrail(dt) {
      hoverTime += dt;
      hoverUniforms.uTime.value = hoverTime;
      for (let i = trail.length - 1; i >= 0; i--) {
        trail[i].strength -= dt * 0.38;                  // 약 2.6초에 걸쳐 서서히 로고로 복귀
        if (trail[i].strength <= 0) trail.splice(i, 1);
      }
      if (trail.length === 0) lastHoverPoint = null;
      const arr = hoverUniforms.uTrail.value;
      for (let i = 0; i < TRAIL_MAX; i++) {
        const t = trail[i];
        if (t) arr[i].set(t.point.x, t.point.y, t.point.z, t.strength * t.strength * (3 - 2 * t.strength));
        else arr[i].set(0, 0, 0, 0);
      }
    }

    // --- 3. 핵심 인터랙션 로직 (Pointer & Dynamic Grouping & Snapping) ---

    function setupPointerEvents(domElement) {
      // 드래그(큐브 회전/시점 회전)가 시작되면 정면 보기 모드 해제. 단순 클릭은 유지.
      const downPos = new THREE.Vector2();
      let downActive = false;
      domElement.addEventListener('pointerdown', (e) => { downPos.set(e.clientX, e.clientY); downActive = true; });
      window.addEventListener('pointerup', () => { downActive = false; });
      window.addEventListener('pointermove', (e) => {
        if (downActive && frontMode &&
          Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > CONFIG.dragThreshold) {
          setFrontMode(false);
        }
      });
      domElement.addEventListener('pointerdown', onPointerDown, { passive: false });
      window.addEventListener('pointermove', onPointerMove, { passive: false });
      window.addEventListener('pointerup', onPointerUp, { passive: false });
      window.addEventListener('pointercancel', onPointerUp, { passive: false });

      // 마우스 호버 시 커서 피드백 + 텍스처 드러내기
      domElement.addEventListener('mousemove', (e) => {
        if (revealed && frontMode && cubelets.length) {
          const r = domElement.getBoundingClientRect();
          pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
          pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
          raycaster.setFromCamera(pointer, camera);
          const h = raycaster.intersectObjects(cubelets, true);
          if (h.length > 0) addTrailPoint(h[0].point);
          else lastHoverPoint = null;
        }
        if (dragSession.isPointerDown || isRotating) return;
        const rect = domElement.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(cubelets, true);
        domElement.style.cursor = hits.length > 0 ? 'grab' : 'default';
      });
    }

    /**
     * 포인터를 눌렀을 때 (pointerdown):
     * Raycaster를 이용해 클릭된 큐브 조각과 해당 면의 월드 법선 벡터(World Normal)를 감지
     */
    function onPointerDown(e) {
      if (isRotating) return; // 회전 애니메이션 중 인터랙션 락
      if (e.button !== 0 && e.pointerType === 'mouse') return; // 좌클릭만 허용

      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

      raycaster.setFromCamera(pointer, camera);
      const intersects = raycaster.intersectObjects(cubelets, true);

      if (intersects.length > 0) {
        // [큐브 조각 클릭]
        const hit = intersects[0];

        // cubeGroup 직속 자식인 큐브렛 루트 오브젝트 탐색
        let rootCubelet = hit.object;
        while (rootCubelet.parent && rootCubelet.parent !== cubeGroup && rootCubelet.parent !== scene) {
          rootCubelet = rootCubelet.parent;
        }

        // 클릭된 면의 월드 법선 벡터(World Normal) 계산
        const normalMatrix = new THREE.Matrix3().getNormalMatrix(hit.object.matrixWorld);
        const worldNormal = hit.face.normal.clone().applyMatrix3(normalMatrix).normalize();
        roundVectorToMajorAxis(worldNormal);

        // 드래그 세션 초기화
        dragSession.isPointerDown = true;
        dragSession.startScreenPos.set(e.clientX, e.clientY);
        dragSession.currentScreenPos.set(e.clientX, e.clientY);
        dragSession.clickedCubelet = rootCubelet;
        dragSession.clickedPoint.copy(hit.point);
        dragSession.clickedWorldNormal.copy(worldNormal);
        dragSession.dragState = 'PENDING';

        // 큐브 드래그 중에는 OrbitControls 일시 비활성화
        controls.enabled = false;
        renderer.domElement.style.cursor = 'grabbing';
      } else {
        // [배경 빈 공간 클릭]: OrbitControls 정상 작동
        dragSession.isPointerDown = false;
        dragSession.dragState = 'IDLE';
        controls.enabled = true;
      }
    }

    /**
     * 포인터를 움직일 때 (pointermove):
     * 1) 일정 거리(dragThreshold) 이상 드래그 시 회전 축 판정 및 9개 조각 동적 그룹화
     * 2) 드래그 중 실시간 각도 반영
     */
    function onPointerMove(e) {
      if (!dragSession.isPointerDown || isRotating) return;

      dragSession.currentScreenPos.set(e.clientX, e.clientY);
      const dx = dragSession.currentScreenPos.x - dragSession.startScreenPos.x;
      const dy = dragSession.currentScreenPos.y - dragSession.startScreenPos.y;
      const dist = Math.hypot(dx, dy);

      // A. 회전 축 판정 및 동적 그룹화 (PENDING 상태)
      if (dragSession.dragState === 'PENDING') {
        if (dist > CONFIG.dragThreshold) {
          const success = setupDynamicGroup(dx, dy);
          if (success) {
            dragSession.dragState = 'ROTATING';
          } else {
            dragSession.dragState = 'IDLE';
            controls.enabled = true;
            renderer.domElement.style.cursor = 'default';
          }
        }
        return;
      }

      // B. 실시간 드래그 회전 (ROTATING 상태)
      if (dragSession.dragState === 'ROTATING' && dragSession.tempPivot) {
        const dragVector = new THREE.Vector2(dx, dy);
        // 화면에 투영된 기준 방향과의 정사영 계산
        const projection = dragVector.dot(dragSession.screenTangent);

        // 각도 매핑 (사용자 드래그 거리에 비례한 회전각)
        const angle = projection * 0.007;

        // 임시 피벗 실시간 회전
        dragSession.tempPivot.rotation[dragSession.axisName] = angle;
      }
    }

    /**
     * 포인터를 뗄 때 (pointerup):
     * 가장 가까운 90도 각도로 GSAP 스냅 애니메이션 실행
     */
    function onPointerUp() {
      if (!dragSession.isPointerDown) return;
      dragSession.isPointerDown = false;
      renderer.domElement.style.cursor = 'default';

      if (dragSession.dragState === 'ROTATING' && dragSession.tempPivot) {
        snapAndFinalizeRotation();
      } else {
        const wasClick = dragSession.dragState === 'PENDING' &&
          dragSession.startScreenPos.distanceTo(dragSession.currentScreenPos) < CONFIG.dragThreshold;
        cleanupTempPivot();
        dragSession.dragState = 'IDLE';
        controls.enabled = true;
        // 정면 보기 상태에서 사진을 클릭하면 해당 노래 재생
        if (wasClick && frontMode) handleTileClick(dragSession.startScreenPos.x, dragSession.startScreenPos.y);
      }
    }

    // --- 정면 보기에서 사진 클릭 → 사진 고정 + 노래 재생 + 배경색 변경 ---
    let selectedIdx = -1;
    let selSlot = 0;
    let currentAudio = null;
    const audioCache = {};

    function handleTileClick(clientX, clientY) {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(cubelets, true);
      const hit = hits.find((h) => h.object.material && h.object.material.map);
      if (!hit) return;

      // 정면(+X)을 향한 면만 허용
      const nm = new THREE.Matrix3().getNormalMatrix(hit.object.matrixWorld);
      const n = hit.face.normal.clone().applyMatrix3(nm).normalize();
      if (n.x < 0.8) return;

      let root = hit.object;
      while (root.parent && root.parent !== cubeGroup) root = root.parent;
      const center = new THREE.Box3().setFromObject(root).getCenter(new THREE.Vector3());

      // 정면 기준: 화면 왼쪽 = +Z, 위쪽 = +Y  →  왼쪽 위가 01
      const row = 1 - Math.round(center.y / CONFIG.cubeSpacing);
      const col = 1 - Math.round(center.z / CONFIG.cubeSpacing);
      if (row < 0 || row > 2 || col < 0 || col > 2) return;
      const idx = row * 3 + col;
      if (idx === selectedIdx) {
        // 같은 사진을 다시 클릭하면 노래 중단 / 다시 클릭하면 재생
        if (currentAudio) stopSong(); else playSong(idx);
        return;
      }
      selectedIdx = idx;

      // 사진 고정 (이전 선택은 페이드 아웃, 새 선택은 클릭 지점에서 물결처럼 퍼짐)
      const oldSlot = selSlot;
      selSlot = 1 - selSlot;
      const C = hoverUniforms.uSelC.value;
      const P = hoverUniforms.uSelP.value;
      gsap.to(C[oldSlot], { w: 0, duration: 0.6, overwrite: true });
      C[selSlot].set(hit.point.x, center.y, center.z, 1);
      P[selSlot].set(hit.point.x, hit.point.y, hit.point.z, 0);
      gsap.to(P[selSlot], { w: 8, duration: 1.2, ease: 'power2.out', overwrite: true });

      playSong(idx);
      setBackgroundFromTile(hit.uv);
    }

    function playSong(idx) {
      if (currentAudio) {
        const old = currentAudio;
        gsap.to(old, { volume: 0, duration: 0.5, overwrite: true, onComplete: () => { if (old !== currentAudio) old.pause(); } });
      }
      const a = audioCache[idx] || (audioCache[idx] = new Audio(CONFIG.songs[idx]));
      a.currentTime = 0;
      a.volume = 0;
      a.play().catch(() => { });
      gsap.to(a, { volume: 1, duration: 0.9, overwrite: true });
      currentAudio = a;
    }

    function stopSong() {
      if (!currentAudio) return;
      const old = currentAudio;
      currentAudio = null;
      gsap.to(old, { volume: 0, duration: 0.4, overwrite: true, onComplete: () => { if (old !== currentAudio) old.pause(); } });
    }

    // 선택한 사진의 대표 색상 추출
    function sampleTileColor(uv) {
      try {
        const img = hoverUniforms.uAltMap.value.image;
        const W = img.naturalWidth || img.width, H = img.naturalHeight || img.height;
        const span = 0.02;
        const size = 24;
        const cv = document.createElement('canvas');
        cv.width = cv.height = size;
        const ctx = cv.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, (uv.x - span) * W, (uv.y - span) * H, span * 2 * W, span * 2 * H, 0, 0, size, size);
        const d = ctx.getImageData(0, 0, size, size).data;
        let r = 0, g = 0, b = 0, wsum = 0;
        for (let i = 0; i < d.length; i += 4) {
          if (d[i + 3] < 128 || d[i] + d[i + 1] + d[i + 2] > 730) continue; // 투명/흰 배경 제외
          const mx = Math.max(d[i], d[i + 1], d[i + 2]), mn = Math.min(d[i], d[i + 1], d[i + 2]);
          const w = 0.3 + (mx - mn) / 255;                                   // 채도 높은 픽셀 가중
          r += d[i] * w; g += d[i + 1] * w; b += d[i + 2] * w; wsum += w;
        }
        if (wsum === 0) return new THREE.Color(0xcccccc);
        return new THREE.Color().setRGB(r / wsum / 255, g / wsum / 255, b / wsum / 255, THREE.SRGBColorSpace);
      } catch (e) {
        return new THREE.Color(0xcccccc);
      }
    }

    // --- 움직이는 그라데이션 배경 ---
    const bgBase = new THREE.Color(0xffffff);   // 현재(트윈 중) 배경 기준색
    let bgTime = 0;

    function setBackgroundFromTile(uv) {
      const c = sampleTileColor(uv);
      gsap.to(bgBase, { r: c.r, g: c.g, b: c.b, duration: 1.8, ease: 'sine.inOut', overwrite: true });
    }

    function updateBackground(dt) {
      bgTime += dt;
      const hsl = {};
      bgBase.getHSL(hsl);
      const mk = (dh, dl) => new THREE.Color().setHSL((hsl.h + dh + 1) % 1, hsl.s, Math.min(0.97, Math.max(0, hsl.l + dl)));
      const css = (c) => '#' + c.getHexString();
      const c1 = css(bgBase), c2 = css(mk(0.07, 0.10)), c3 = css(mk(-0.06, 0.2));

      const x1 = 50 + 38 * Math.sin(bgTime * 0.35), y1 = 50 + 32 * Math.cos(bgTime * 0.28);
      const x2 = 50 + 40 * Math.cos(bgTime * 0.23 + 1.3), y2 = 50 + 36 * Math.sin(bgTime * 0.31 + 0.7);
      document.body.style.background =
        `radial-gradient(circle at ${x1}% ${y1}%, ${c3} 0%, transparent 55%), ` +
        `radial-gradient(circle at ${x2}% ${y2}%, ${c2} 0%, transparent 60%), ${c1}`;

      // 배경이 어두우면 버튼 아이콘을 밝게
      const lum = 0.299 * bgBase.r + 0.587 * bgBase.g + 0.114 * bgBase.b;
      document.documentElement.style.setProperty('--ui-fg', lum < 0.45 ? '#ffffff' : '#1e293b');
    }

    /**
     * [회전 축 결정 및 동적 그룹화 로직 (Dynamic Grouping)]
     */
    function setupDynamicGroup(dx, dy) {
      const normal = dragSession.clickedWorldNormal;
      const hitPt = dragSession.clickedPoint;

      // 1. 해당 법선에 직교하는 2개의 후보 회전 축 도출
      let candidateAxes = [];
      if (Math.abs(normal.x) > 0.5) {
        candidateAxes = [new THREE.Vector3(0, 1, 0), new THREE.Vector3(0, 0, 1)];
      } else if (Math.abs(normal.y) > 0.5) {
        candidateAxes = [new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 0, 1)];
      } else {
        candidateAxes = [new THREE.Vector3(1, 0, 0), new THREE.Vector3(0, 1, 0)];
      }

      const mouseDir = new THREE.Vector2(dx, dy).normalize();

      // 2. 화면상에서 양의 회전 시 움직이는 방향과 마우스 드래그 방향 비교
      let bestAxis = null;
      let maxProj = -Infinity;
      let bestTangentScreen = new THREE.Vector2();

      candidateAxes.forEach((axis) => {
        // 순간 접선 방향: Tangent3D = Axis x HitPoint
        const tangent3D = new THREE.Vector3().crossVectors(axis, hitPt).normalize();

        const p1 = hitPt.clone();
        const p2 = hitPt.clone().add(tangent3D.clone().multiplyScalar(1.0));

        const p1Screen = toScreenXY(p1, camera, renderer.domElement);
        const p2Screen = toScreenXY(p2, camera, renderer.domElement);
        const screenTangent = new THREE.Vector2().subVectors(p2Screen, p1Screen).normalize();

        const proj = Math.abs(mouseDir.dot(screenTangent));
        if (proj > maxProj) {
          maxProj = proj;
          bestAxis = axis;
          bestTangentScreen.copy(screenTangent);
        }
      });

      if (!bestAxis || maxProj < 0.15) return false;

      dragSession.screenTangent.copy(bestTangentScreen);

      let axisName = 'x';
      if (Math.abs(bestAxis.y) > 0.5) axisName = 'y';
      else if (Math.abs(bestAxis.z) > 0.5) axisName = 'z';
      dragSession.axisName = axisName;

      // 3. 클릭된 조각의 현재 바운딩 박스 중심 좌표 계산
      const clickedBox = new THREE.Box3().setFromObject(dragSession.clickedCubelet);
      const clickedCenter = new THREE.Vector3();
      clickedBox.getCenter(clickedCenter);
      const clickedCoord = clickedCenter[axisName];

      // 4. 동일한 레이어 평면에 위치한 9개 큐브 조각 식별
      const sliceCubelets = [];
      const threshold = CONFIG.cubeSpacing * 0.45;

      cubelets.forEach((c) => {
        const box = new THREE.Box3().setFromObject(c);
        const center = new THREE.Vector3();
        box.getCenter(center);

        if (Math.abs(center[axisName] - clickedCoord) < threshold) {
          sliceCubelets.push(c);
        }
      });

      if (sliceCubelets.length !== 9) {
        console.warn(`Layer grouping issue: Expected 9 cubelets, found ${sliceCubelets.length}`);
        return false;
      }

      dragSession.activeSliceCubelets = sliceCubelets;

      // 5. [동적 그룹화: Dynamic Grouping]
      // 씬의 원점(0, 0, 0)에 임시 빈 Object3D(Pivot)를 생성하고 9개의 조각을 자식으로 편입
      dragSession.tempPivot = new THREE.Object3D();
      scene.add(dragSession.tempPivot);

      // Three.js의 attach()는 월드 트랜스폼(위치, 회전, 스케일)을 그대로 보존하면서 피벗으로 부모를 변경합니다.
      sliceCubelets.forEach((cubelet) => {
        dragSession.tempPivot.attach(cubelet);
      });

      return true;
    }

    /**
     * [90도 스냅 애니메이션 및 좌표 갱신 (GSAP)]
     */
    function snapAndFinalizeRotation() {
      isRotating = true; // 락 설정
      dragSession.dragState = 'IDLE';

      const pivot = dragSession.tempPivot;
      const axisName = dragSession.axisName;
      const currentAngle = pivot.rotation[axisName];

      // 가장 가까운 90도(Math.PI / 2) 배수로 스냅 목표 각도 계산
      const halfPi = Math.PI / 2;
      const targetAngle = Math.round(currentAngle / halfPi) * halfPi;

      gsap.to(pivot.rotation, {
        [axisName]: targetAngle,
        duration: CONFIG.snapDuration,
        ease: CONFIG.snapEase,
        onComplete: () => {
          /**
           * =========================================================================
           * [좌표 갱신 및 그룹 해제 (Matrix Update & Detach) 핵심 로직]
           * =========================================================================
           * 1. 90도 회전된 피벗 상태에서 각 큐브 조각의 World Matrix를 강제 최신화합니다.
           *    (cubelet.updateMatrixWorld(true))
           * 
           * 2. cubeGroup.attach(cubelet)을 호출하여 피벗에서 떼어내 씬의 루트 컨테이너로 복귀합니다.
           *    Three.js의 attach()는 피벗 회전으로 일어난 모든 변위를 cubelet의
           *    로컬 좌표(position, quaternion)로 완벽하게 베이킹(Baking)합니다.
           * 
           * 3. 부동소수점 오차 정규화:
           *    각 조각의 회전 쿼터니언을 오쏘노멀(Orthonormal) 90도 배수로 정렬하여
           *    미세한 부동 소수점 오차가 누적되는 것을 원천 차단합니다.
           * 
           * 4. 사용이 끝난 임시 피벗을 씬에서 제거합니다. (scene.remove(pivot))
           * 
           * 이 과정 덕분에 다음 턴에 다른 어떤 축으로 회전시켜도
           * 짐벌락(Gimbal Lock)이나 축 꼬임 없이 완벽하게 독립 동작합니다.
           * =========================================================================
           */
          const activeCubelets = dragSession.activeSliceCubelets;

          activeCubelets.forEach((cubelet) => {
            // 월드 매트릭스 갱신
            cubelet.updateMatrixWorld(true);

            // 임시 피벗에서 분리하여 원래 부모(cubeGroup)로 복귀 (World Transform 유지)
            cubeGroup.attach(cubelet);

            // 회전 쿼터니언 정규화
            const euler = new THREE.Euler().setFromQuaternion(cubelet.quaternion, 'XYZ');
            euler.x = Math.round(euler.x / halfPi) * halfPi;
            euler.y = Math.round(euler.y / halfPi) * halfPi;
            euler.z = Math.round(euler.z / halfPi) * halfPi;
            cubelet.quaternion.setFromEuler(euler);

            cubelet.updateMatrixWorld(true);
          });

          // 임시 피벗 제거
          scene.remove(pivot);
          dragSession.tempPivot = null;
          dragSession.activeSliceCubelets = [];

          // 인터랙션 락 해제
          isRotating = false;
          controls.enabled = true;
        }
      });
    }

    function cleanupTempPivot() {
      if (dragSession.tempPivot) {
        dragSession.activeSliceCubelets.forEach((cubelet) => {
          cubeGroup.attach(cubelet);
        });
        scene.remove(dragSession.tempPivot);
        dragSession.tempPivot = null;
        dragSession.activeSliceCubelets = [];
      }
    }

    // --- 4. 셔플(Shuffle) & 초기화(Reset) ---

    function shuffleCube(moves = 12) {
      if (isRotating) return;
      setFrontMode(false);
      isRotating = true;
      controls.enabled = false;

      const axes = ['x', 'y', 'z'];
      const layerSteps = [-CONFIG.cubeSpacing, 0, CONFIG.cubeSpacing];
      const directions = [Math.PI / 2, -Math.PI / 2];

      let currentMove = 0;

      function performSingleMove() {
        if (currentMove >= moves) {
          isRotating = false;
          controls.enabled = true;
          return;
        }

        currentMove++;
        const axisName = axes[Math.floor(Math.random() * axes.length)];
        const layerCoord = layerSteps[Math.floor(Math.random() * layerSteps.length)];
        const deltaAngle = directions[Math.floor(Math.random() * directions.length)];

        // 해당 층의 9개 조각 필터링
        const slice = [];
        const threshold = CONFIG.cubeSpacing * 0.45;
        cubelets.forEach(c => {
          const box = new THREE.Box3().setFromObject(c);
          const center = new THREE.Vector3();
          box.getCenter(center);
          if (Math.abs(center[axisName] - layerCoord) < threshold) {
            slice.push(c);
          }
        });

        const pivot = new THREE.Object3D();
        scene.add(pivot);
        slice.forEach(c => pivot.attach(c));

        gsap.to(pivot.rotation, {
          [axisName]: deltaAngle,
          duration: 0.16,
          ease: 'power1.inOut',
          onComplete: () => {
            slice.forEach(c => {
              c.updateMatrixWorld(true);
              cubeGroup.attach(c);

              const euler = new THREE.Euler().setFromQuaternion(c.quaternion, 'XYZ');
              const halfPi = Math.PI / 2;
              euler.x = Math.round(euler.x / halfPi) * halfPi;
              euler.y = Math.round(euler.y / halfPi) * halfPi;
              euler.z = Math.round(euler.z / halfPi) * halfPi;
              c.quaternion.setFromEuler(euler);
              c.updateMatrixWorld(true);
            });
            scene.remove(pivot);
            performSingleMove();
          }
        });
      }

      performSingleMove();
    }

    function scrambleInstantly(moves) {
      const axes = ['x', 'y', 'z'];
      const layerSteps = [-CONFIG.cubeSpacing, 0, CONFIG.cubeSpacing];
      const halfPi = Math.PI / 2;
      const threshold = CONFIG.cubeSpacing * 0.45;

      cubeGroup.updateMatrixWorld(true);

      for (let m = 0; m < moves; m++) {
        const axisName = axes[Math.floor(Math.random() * 3)];
        const layerCoord = layerSteps[Math.floor(Math.random() * 3)];
        const deltaAngle = Math.random() < 0.5 ? halfPi : -halfPi;

        const slice = cubelets.filter((c) => {
          const center = new THREE.Box3().setFromObject(c).getCenter(new THREE.Vector3());
          return Math.abs(center[axisName] - layerCoord) < threshold;
        });

        const pivot = new THREE.Object3D();
        scene.add(pivot);
        slice.forEach((c) => pivot.attach(c));
        pivot.rotation[axisName] = deltaAngle;
        pivot.updateMatrixWorld(true);

        slice.forEach((c) => {
          cubeGroup.attach(c);
          const euler = new THREE.Euler().setFromQuaternion(c.quaternion, 'XYZ');
          euler.x = Math.round(euler.x / halfPi) * halfPi;
          euler.y = Math.round(euler.y / halfPi) * halfPi;
          euler.z = Math.round(euler.z / halfPi) * halfPi;
          c.quaternion.setFromEuler(euler);
          c.updateMatrixWorld(true);
        });
        scene.remove(pivot);
      }
    }

    function resetCube() {
      if (isRotating) return;
      isRotating = true;
      controls.enabled = false;

      cubelets.forEach((c) => {
        const targetPos = c.userData.initialPosition;
        const targetQuat = c.userData.initialQuaternion;

        // 위치 복귀
        gsap.to(c.position, {
          x: targetPos.x,
          y: targetPos.y,
          z: targetPos.z,
          duration: 0.5,
          ease: 'back.out(1.2)'
        });

        // 회전 복귀
        const startQuat = c.quaternion.clone();
        const dummy = { t: 0 };

        gsap.to(dummy, {
          t: 1,
          duration: 0.5,
          ease: 'power2.out',
          onUpdate: () => {
            THREE.Quaternion.slerp(startQuat, targetQuat, c.quaternion, dummy.t);
          },
          onComplete: () => {
            c.quaternion.copy(targetQuat);
            c.updateMatrixWorld(true);
          }
        });
      });

      // 카메라를 큐브의 한 면이 정면으로 보이는 위치로 이동 (구면 보간)
      const startSph = new THREE.Spherical().setFromVector3(camera.position);
      const endTheta = Math.PI / 2; // +X(오른쪽) 면이 정면
      const endPhi = Math.PI / 2;
      const dTheta = ((endTheta - startSph.theta + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
      const proxy = { t: 0 };

      gsap.to(proxy, {
        t: 1,
        duration: 1.0,
        ease: 'power2.inOut',
        onUpdate: () => {
          const s = new THREE.Spherical(
            startSph.radius,
            startSph.phi + (endPhi - startSph.phi) * proxy.t,
            startSph.theta + dTheta * proxy.t
          );
          camera.position.setFromSpherical(s);
          camera.lookAt(controls.target);
        },
        onComplete: () => {
          isRotating = false;
          controls.enabled = true;
          setFrontMode(true);
        }
      });
    }

    // --- 5. UI 이벤트 및 유틸리티 ---

    function setupUIEvents() {
      document.getElementById('btn-shuffle').addEventListener('click', () => shuffleCube(14));
      document.getElementById('btn-reset').addEventListener('click', resetCube);
    }

    function hideLoader() {
      const loader = document.getElementById('loader');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 500);
      }
    }

    function roundVectorToMajorAxis(vec) {
      const ax = Math.abs(vec.x);
      const ay = Math.abs(vec.y);
      const az = Math.abs(vec.z);

      if (ax >= ay && ax >= az) {
        vec.set(Math.sign(vec.x), 0, 0);
      } else if (ay >= ax && ay >= az) {
        vec.set(0, Math.sign(vec.y), 0);
      } else {
        vec.set(0, 0, Math.sign(vec.z));
      }
      return vec;
    }

    function toScreenXY(pos3D, camera, canvas) {
      const v = pos3D.clone().project(camera);
      const rect = canvas.getBoundingClientRect();
      return new THREE.Vector2(
        ((v.x + 1) * 0.5) * rect.width + rect.left,
        (-(v.y - 1) * 0.5) * rect.height + rect.top
      );
    }

    function onWindowResize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    }

    // --- 6. 렌더 루프 ---
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();
      updateTrail(dt);
      updateBackground(dt);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
